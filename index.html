<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger-style Copilot Chat</title>
  <style>
    :root {
      --bg: #eceff3;
      --panel: #ffffff;
      --header: #ffe066;
      --header-deep: #f7cd32;
      --text: #202124;
      --subtle: #667084;
      --bubble-me: #fee500;
      --bubble-other: #ffffff;
      --focus: #1f6feb;
      --shadow: 0 14px 36px rgba(36, 45, 66, 0.2);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(180deg, #f6f7fb 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(420px, 100%);
      height: min(860px, calc(100vh - 40px));
      background: var(--panel);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #dfe4ec;
    }

    .topbar {
      background: linear-gradient(180deg, var(--header) 0%, var(--header-deep) 100%);
      padding: 10px 14px 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .status {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #27272a;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
      flex: 0 0 auto;
    }

    .chat-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-icons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    main {
      flex: 1;
      overflow: auto;
      padding: 14px;
      background: #f3f4f8;
    }

    .notice {
      margin: 0 0 12px;
      color: #505b74;
      font-size: 12px;
      text-align: center;
    }

    .bubble {
      max-width: 90%;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 14px;
      border: 1px solid rgba(32, 33, 36, 0.08);
    }

    .bubble.other {
      background: var(--bubble-other);
      border-top-left-radius: 8px;
    }

    .bubble.me {
      margin-left: auto;
      background: var(--bubble-me);
      border-top-right-radius: 8px;
    }

    .engine-panel {
      background: #fff;
      border: 1px solid #d7deea;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 8px;
    }

    .engine-label {
      margin: 0;
      padding: 9px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e6eaf2;
      font-size: 12px;
      color: var(--subtle);
      font-weight: 600;
    }

    iframe {
      width: 100%;
      height: min(55vh, 460px);
      border: 0;
      display: block;
      background: #fff;
    }

    .composer {
      padding: 10px 12px 14px;
      background: #fff;
      border-top: 1px solid #e0e5ef;
    }

    .composer form {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .composer input {
      flex: 1;
      border: 1px solid #d4dce7;
      border-radius: 22px;
      padding: 10px 14px;
      font-size: 14px;
      background: #fbfcff;
      color: var(--text);
    }

    .composer button {
      border: 0;
      border-radius: 18px;
      padding: 10px 13px;
      background: #2f3a4f;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .composer-help {
      margin: 8px 2px 0;
      font-size: 11px;
      color: #5f6d86;
    }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }

      iframe {
        height: min(58vh, 460px);
      }
    }
  </style>
</head>
<body>
  <section class="app" aria-label="KakaoTalk-inspired messenger layout">
    <header class="topbar">
      <div class="status" aria-label="Status bar">
        <span>19:04</span>
        <span aria-hidden="true">📶 🔋</span>
      </div>
      <div class="title-row">
        <div class="profile">
          <span class="avatar" aria-hidden="true">🤖</span>
          <h1 class="chat-title">AI Assistant Chat</h1>
        </div>
        <div class="top-icons" aria-label="Messenger actions">
          <button class="icon-btn" type="button" aria-label="Search chat">🔍</button>
          <button class="icon-btn" type="button" aria-label="Open menu">☰</button>
        </div>
      </div>
    </header>

    <main aria-label="Conversation and bot panel">
      <p class="notice">KakaoTalk-inspired style demo (not an official KakaoTalk UI).</p>
      <p class="bubble other">Hi! Use the embedded panel below to chat with the Copilot Studio bot.</p>
      <p class="bubble me">Great, opening the bot now ✨</p>
      <section class="engine-panel" aria-label="Copilot Studio chat engine">
        <p class="engine-label">Copilot Studio Web Chat</p>
        <iframe
          title="Copilot Studio chat"
          src="https://copilotstudio.microsoft.com/environments/Default-b191802e-6d1f-456c-af2d-ebd2ab881e8e/bots/nara_multimodelaiagent_vb2GGk/webchat?__version__=2&enableFileAttachment=false&cliAgent=true">
        </iframe>
      </section>
    </main>

    <footer class="composer">
      <form action="#" aria-label="Message composer (visual only)">
        <label for="message-input" class="sr-only">Type a message</label>
        <input id="message-input" name="message" type="text" placeholder="Type a message…">
        <button type="submit">Send</button>
      </form>
      <p class="composer-help">Tip: Send messages in the embedded Copilot Studio chat panel above.</p>
    </footer>
  </section>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    document.querySelector(".composer form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("message-input").value = "";
    });
  </script>
</body>
</html>
